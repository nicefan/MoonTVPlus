name: Build MoonTVPlus Windows x64 Desktop

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moontvplus-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 Desktop
    if: github.ref == 'refs/heads/desktop'
    runs-on: windows-2022

    env:
      NEXT_PUBLIC_STORAGE_TYPE: upstash
      NODE_ENV: production
      UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
      UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Configure pnpm for Next standalone
        run: pnpm config set node-linker hoisted --location project

      - name: Install MoonTVPlus dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MoonTVPlus standalone
        run: pnpm build

      - name: Validate standalone output
        shell: pwsh
        run: |
          if (!(Test-Path '.next/standalone/server.js')) { throw 'Missing standalone server.js' }
          Push-Location '.next/standalone'
          node -e "console.log(require.resolve('next/package.json')); console.log(require.resolve('styled-jsx/package.json'))"
          Pop-Location

      - name: Prepare minimal desktop runtime
        shell: pwsh
        run: |
          if (Test-Path desktop/runtime) { Remove-Item -Recurse -Force desktop/runtime }
          New-Item -ItemType Directory -Force -Path desktop/runtime/server | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/runtime/node | Out-Null

          robocopy '.next\standalone' 'desktop\runtime\server' /E /COPY:DAT /R:2 /W:1
          if ($LASTEXITCODE -ge 8) { throw "copy standalone failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          robocopy '.next\static' 'desktop\runtime\server\.next\static' /E /COPY:DAT /R:2 /W:1
          if ($LASTEXITCODE -ge 8) { throw "copy static failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          Copy-Item (Get-Command node).Source 'desktop/runtime/node/node.exe'

      - name: Install desktop packaging dependencies
        working-directory: desktop
        run: npm install --include=dev --no-audit --no-fund

      - name: Build Windows x64 installer
        working-directory: desktop
        run: npm run dist:win

      - name: Verify packaged minimal runtime
        shell: pwsh
        run: |
          $root = 'desktop/dist/win-unpacked/resources'
          foreach ($file in @(
            "$root/server/server.js",
            "$root/server/node_modules/next/package.json",
            "$root/server/node_modules/styled-jsx/package.json",
            "$root/node/node.exe"
          )) {
            if (!(Test-Path $file)) { throw "Packaged standalone runtime missing: $file" }
          }

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: MoonTVPlus-windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
