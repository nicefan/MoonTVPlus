name: Build MoonTVPlus Windows x64 Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moontvplus-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 Desktop
    if: github.ref == 'refs/heads/desktop'
    runs-on: windows-2022

    env:
      NEXT_PUBLIC_STORAGE_TYPE: upstash
      NODE_ENV: production
      UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
      UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build identifier
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmm')
          $buildId = "$shortSha-$buildTime"
          "BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Build identifier: $buildId"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Validate required secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UPSTASH_URL)) { $missing += 'UPSTASH_URL' }
          if ([string]::IsNullOrWhiteSpace($env:UPSTASH_TOKEN)) { $missing += 'UPSTASH_TOKEN' }
          if ([string]::IsNullOrWhiteSpace($env:USERNAME)) { $missing += 'USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:PASSWORD)) { $missing += 'PASSWORD' }
          if ($missing.Count -gt 0) { throw "Missing GitHub Actions secrets: $($missing -join ', ')" }

      # Next 14 output tracing is more reliable with a hoisted dependency layout.
      # This only affects the CI installation layout; the packaged app still uses
      # Next's minimal .next/standalone runtime rather than a full node_modules tree.
      - name: Configure pnpm for Next standalone
        shell: pwsh
        run: pnpm config set node-linker hoisted --location project

      - name: Install MoonTVPlus dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MoonTVPlus standalone
        run: pnpm build

      - name: Validate native standalone output
        shell: pwsh
        run: |
          if (!(Test-Path '.next/standalone/server.js')) {
            throw 'Next standalone server.js was not generated'
          }
          if (!(Test-Path '.next/standalone/node_modules')) {
            throw 'Next standalone node_modules was not generated'
          }

          Push-Location '.next/standalone'
          node -e "console.log('next:',require.resolve('next/package.json'));console.log('styled-jsx:',require.resolve('styled-jsx/package.json'));console.log('@swc/helpers:',require.resolve('@swc/helpers/package.json'))"
          Pop-Location

      - name: Prepare minimal desktop runtime
        shell: pwsh
        run: |
          $runtimeRoot = 'desktop/runtime'
          $serverRoot = "$runtimeRoot/server"
          $nodeRoot = "$runtimeRoot/node"

          if (Test-Path $runtimeRoot) { Remove-Item -Recurse -Force $runtimeRoot }
          New-Item -ItemType Directory -Force -Path $serverRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $nodeRoot | Out-Null

          # Copy Next's native standalone tree exactly as generated.
          # robocopy preserves the complete directory tree more reliably than
          # Copy-Item wildcards and does not replace standalone node_modules.
          robocopy '.next\standalone' $serverRoot /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy standalone failed with exit code $LASTEXITCODE" }

          New-Item -ItemType Directory -Force -Path "$serverRoot/.next" | Out-Null
          robocopy '.next\static' "$serverRoot\.next\static" /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy static failed with exit code $LASTEXITCODE" }

          if (Test-Path public) {
            robocopy 'public' "$serverRoot\public" /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "robocopy public failed with exit code $LASTEXITCODE" }
          }

          # Do NOT run npm install here. The runtime must remain the minimal
          # dependency tree produced by Next output: standalone.
          Push-Location $serverRoot
          node -e "console.log('runtime next:',require.resolve('next/package.json'));console.log('runtime styled-jsx:',require.resolve('styled-jsx/package.json'));console.log('runtime @swc/helpers:',require.resolve('@swc/helpers/package.json'))"
          Pop-Location

          $nodeExe = (Get-Command node).Source
          Copy-Item -Force $nodeExe "$nodeRoot/node.exe"

          $runtimeConfig = @{
            NEXT_PUBLIC_STORAGE_TYPE = 'upstash'
            UPSTASH_URL = $env:UPSTASH_URL
            UPSTASH_TOKEN = $env:UPSTASH_TOKEN
            USERNAME = $env:USERNAME
            PASSWORD = $env:PASSWORD
            BUILD_ID = $env:BUILD_ID
          } | ConvertTo-Json -Compress
          Set-Content -Path "$runtimeRoot/runtime-config.json" -Value $runtimeConfig -Encoding UTF8

          $serverSize = (Get-ChildItem $serverRoot -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $serverFiles = (Get-ChildItem $serverRoot -Recurse -File | Measure-Object).Count
          Write-Host "Standalone runtime files: $serverFiles"
          Write-Host "Standalone runtime size: $([math]::Round($serverSize / 1MB, 2)) MB"

      - name: Smoke test native standalone runtime
        shell: pwsh
        run: |
          $env:HOSTNAME = '127.0.0.1'
          $env:PORT = '32109'
          $proc = Start-Process -FilePath "desktop/runtime/node/node.exe" -ArgumentList "server.js" -WorkingDirectory "desktop/runtime/server" -PassThru -RedirectStandardOutput "desktop/smoke-out.log" -RedirectStandardError "desktop/smoke-err.log"
          Start-Sleep -Seconds 7
          if ($proc.HasExited) {
            Write-Host 'Native standalone server failed during CI smoke test.'
            if (Test-Path desktop/smoke-out.log) { Get-Content desktop/smoke-out.log }
            if (Test-Path desktop/smoke-err.log) { Get-Content desktop/smoke-err.log }
            throw "MoonTVPlus standalone server exited with code $($proc.ExitCode)"
          }
          try {
            Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:32109/" -TimeoutSec 20 | Out-Null
            Write-Host 'Native standalone smoke test passed.'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install desktop packaging dependencies
        working-directory: desktop
        shell: pwsh
        run: npm install --include=dev --no-audit --no-fund

      - name: Build Windows x64 installer
        working-directory: desktop
        shell: pwsh
        run: npm run dist:win

      - name: Verify packaged minimal runtime
        shell: pwsh
        run: |
          $root = 'desktop/dist/win-unpacked/resources'
          foreach ($file in @(
            "$root/server/server.js",
            "$root/server/node_modules/next/package.json",
            "$root/server/node_modules/styled-jsx/package.json",
            "$root/server/node_modules/@swc/helpers/package.json",
            "$root/node/node.exe",
            "$root/runtime-config.json"
          )) {
            Write-Host "Checking packaged file: $file"
            if (!(Test-Path $file)) { throw "Packaged standalone runtime missing: $file" }
          }
          Write-Host 'Packaged minimal standalone verification passed.'

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: MoonTVPlus-windows-x64-${{ env.BUILD_ID }}
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
